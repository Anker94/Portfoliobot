name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance pandas numpy

      - name: Run unit tests
        run: |
          python -m unittest dashboard.tests.test_parser_variants -v

      - name: Smoke-test: import lib + dashboard
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from lib import portfolio_helpers; print('lib OK')"
          python -c "import sys; sys.path.insert(0, '.'); sys.path.insert(0, 'dashboard'); import app; print('dashboard OK')"
